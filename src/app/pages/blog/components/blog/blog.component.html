<ng-container>
  <section [id]="(blogType === 'post') ? 'blog-header' : 'blog-roll'"
           [ngClass]="{'blog-roll-nav': blogType !== 'post','single-post-nav': blogType === 'post'}">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12">
          <div class="section-title text-center">
            <!-- Breadcrumb navigation -->
            <ng-container >
              <ng-container>
                <h2>All Blog Posts</h2>
                <ul class="breadcrumb-nav">
                  <li><a href="index.html">Home</a></li>
                  <li>All blog posts</li>
                </ul>
              </ng-container>
    
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="downloads" class="downloads-section">
    <div class="container">
      <div class="section-title text-center mb-50">
        <h2>Downloads</h2>
        <p>Get our latest brochures, catalogs, and company profiles below.</p>
      </div>
  
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <ul class="list-group">
            <li *ngFor="let file of downloads" class="list-group-item d-flex justify-content-between align-items-center">
              {{ file.name }}
              <a [href]="file.link" target="_blank" class="btn btn-primary btn-sm">Download</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>
  
 
</ng-container>
<ng-template #loading>
  <app-loader></app-loader>
</ng-template>
